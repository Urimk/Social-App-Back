name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Jest Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          CLOUD_NAME: test-cloud
          CLOUD_API_KEY: 1234567890
          CLOUD_API_SECRET: test-secret
